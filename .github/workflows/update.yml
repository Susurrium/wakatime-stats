name: Update WakaTime chart library

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'config.json'
      - 'site/**'
      - 'package*.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: wakatime-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install chart fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - name: Fetch and render verified statistics
        run: npm run update
        env:
          WAKATIME_READ_TOKEN: ${{ secrets.WAKATIME_READ_TOKEN }}
      - name: Publish generated library
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add badges/ charts/ data/ stats.json manifest.json index.html gallery.css gallery.js CATALOG.md .nojekyll
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update WakaTime chart library'
          git push origin HEAD:main
      - name: Upload verified chart batch
        uses: actions/upload-artifact@v7
        with:
          name: wakatime-chart-library
          path: |
            badges/
            charts/
            data/
            stats.json
            manifest.json
            index.html
            gallery.css
            gallery.js
            CATALOG.md
          if-no-files-found: error
